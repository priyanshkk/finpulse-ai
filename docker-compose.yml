services:
  app:
    build: .
    image: finpulse-ai:latest
    container_name: finpulse-ai
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/finpulse.db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      SEED_ON_START: ${SEED_ON_START:-1}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
