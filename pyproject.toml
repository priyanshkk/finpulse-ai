[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finpulse-ai"
version = "0.1.0"
description = "Self-hosted invoice and expense tracker with an AI receipt scanner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Priyanshu" }]
keywords = ["fastapi", "invoices", "expenses", "ocr", "receipts", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "mkdocs>=1.6",
]

[project.urls]
Homepage = "https://github.com/priyanshkk/finpulse-ai"
Documentation = "https://priyanshkk.github.io/finpulse-ai/"
Issues = "https://github.com/priyanshkk/finpulse-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finpulse_ai = ["py.typed", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["docs", "site", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["docs/", "site/", "build/", "dist/"]
